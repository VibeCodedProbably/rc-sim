<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RC Flight Simulator</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9cc9f0;font-family:-apple-system,system-ui,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block}
#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;font:600 14px/1.5 ui-monospace,Menlo,monospace;white-space:pre;text-shadow:0 1px 4px #000;pointer-events:none}
#msg{position:fixed;top:38%;width:100%;text-align:center;font:700 34px system-ui;text-shadow:0 2px 8px #000;pointer-events:none;display:none}
#btns{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;display:flex;gap:8px}
#btns button{font:600 14px system-ui;color:#fff;background:#0007;border:1px solid #fff6;border-radius:10px;padding:10px 14px;backdrop-filter:blur(6px)}
#help{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font:13px/1.6 system-ui;background:#0007;padding:10px 16px;border-radius:12px;text-align:center;pointer-events:none;backdrop-filter:blur(6px)}
.touch #help{display:none}
.stick{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));width:180px;height:180px;border-radius:50%;background:#0004;border:2px solid #fff6;display:none;backdrop-filter:blur(4px)}
.touch .stick{display:block}
#sl{left:max(30px,env(safe-area-inset-left))}#sr{right:max(30px,env(safe-area-inset-right))}
.knob{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px;border-radius:50%;background:#fffd;box-shadow:0 2px 8px #0008}
.lbl{position:absolute;width:100%;text-align:center;top:-24px;font:600 12px system-ui;text-shadow:0 1px 3px #000}
</style></head><body>
<div id="hud"></div><div id="msg"></div>
<div id="btns"><button id="bv">View (C)</button><button id="br">Reset (R)</button></div>
<div id="help">Arrows: pitch / roll &nbsp;·&nbsp; W/S: throttle &nbsp;·&nbsp; A/D: rudder &nbsp;·&nbsp; Space: brake<br>C: change view &nbsp;·&nbsp; R: reset &nbsp;·&nbsp; I: invert pitch<br>Goal: fly through the rings in order, then land on the runway</div>
<div class="stick" id="sl"><div class="lbl">Throttle / Rudder</div><div class="knob"></div></div>
<div class="stick" id="sr"><div class="lbl">Pitch / Roll</div><div class="knob"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const V3=THREE.Vector3,Q=THREE.Quaternion;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sm=(x,a,b)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)document.body.classList.add('touch');

/* ---------- scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9cc9f0);scene.fog=new THREE.Fog(0x9cc9f0,200,1100);
const cam=new THREE.PerspectiveCamera(65,1,0.05,3000);
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xffffff,0x4a6b3a,0.95));
const sun=new THREE.DirectionalLight(0xfff3d6,0.8);sun.position.set(100,200,60);scene.add(sun);

const gt=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle='#4f7d3c';g.fillRect(0,0,128,128);
for(let i=0;i<700;i++){g.fillStyle=`hsl(${85+Math.random()*30},40%,${24+Math.random()*16}%)`;g.fillRect(Math.random()*128,Math.random()*128,2,2)}
const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(500,500);return t})();
const ground=new THREE.Mesh(new THREE.PlaneGeometry(5000,5000),new THREE.MeshLambertMaterial({map:gt}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
const mat=c=>new THREE.MeshLambertMaterial({color:c});
const rw=new THREE.Mesh(new THREE.BoxGeometry(130,0.03,9),mat(0x555a60));rw.position.set(50,0.015,0);scene.add(rw);
for(let x=-5;x<110;x+=10){const d=new THREE.Mesh(new THREE.BoxGeometry(4,0.04,0.3),mat(0xf2f2f2));d.position.set(x,0.02,0);scene.add(d)}
for(let i=0;i<160;i++){const x=-200+Math.random()*700,z=(Math.random()<.5?-1:1)*(25+Math.random()*250);
const tr=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,2,6),mat(0x6b4a2b));tr.position.set(x,1,z);
const lf=new THREE.Mesh(new THREE.ConeGeometry(1.6,5,7),mat(0x2f6b34));lf.position.set(x,4.2,z);scene.add(tr,lf)}
for(let i=0;i<10;i++){const p=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,3,5),mat(i%2?0xff7a1a:0xffffff));p.position.set(-5+i*13,1.5,-7);scene.add(p)}

/* ---------- plane model (body: +X forward, +Y up, +Z right) ---------- */
const plane=new THREE.Group();scene.add(plane);
const box=(w,h,d,c,x,y,z,par=plane)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);par.add(m);return m};
const piv=(x,y,z)=>{const g=new THREE.Group();g.position.set(x,y,z);plane.add(g);return g};
box(0.95,0.12,0.11,0xd8242b,-0.02,0,0);box(0.1,0.13,0.12,0x222222,0.48,0,0);
box(0.24,0.02,1.4,0xf5f5f5,0.04,0.045,0);box(0.1,0.022,0.5,0xf5f5f5,-0.42,0.02,0);box(0.12,0.15,0.016,0xf5f5f5,-0.42,0.1,0);
box(0.14,0.07,0.09,0x99ccff,0.12,0.09,0);
const aL=piv(-0.08,0.045,-0.5),aR=piv(-0.08,0.045,0.5),el=piv(-0.47,0.02,0),ru=piv(-0.48,0.1,0);
box(0.08,0.016,0.5,0xd8242b,-0.04,0,0,aL);box(0.08,0.016,0.5,0xd8242b,-0.04,0,0,aR);
box(0.08,0.016,0.5,0xd8242b,-0.04,0,0,el);box(0.08,0.15,0.016,0xd8242b,-0.04,0,0,ru);
const prop=piv(0.55,0,0);box(0.01,0.3,0.03,0x111111,0,0,0,prop);
const CP=[
 {r:new V3(0.28,-0.12,0),wheel:1,steer:1,k:1500,d:50},
 {r:new V3(-0.08,-0.12,0.17),wheel:1,k:2500,d:60},{r:new V3(-0.08,-0.12,-0.17),wheel:1,k:2500,d:60},
 {r:new V3(0,0.02,0.7),k:2000,d:40},{r:new V3(0,0.02,-0.7),k:2000,d:40},
 {r:new V3(-0.55,0,0),k:2000,d:40},{r:new V3(0.5,0,0),k:2000,d:40},{r:new V3(0,0.14,0),k:2000,d:40}];
CP.filter(k=>k.wheel).forEach(k=>{const s=new THREE.Mesh(new THREE.SphereGeometry(0.045,8,6),mat(0x111111));s.position.copy(k.r);plane.add(s)});
const shadow=new THREE.Mesh(new THREE.CircleGeometry(0.6,16),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:0.35}));
shadow.rotation.x=-Math.PI/2;scene.add(shadow);

/* ---------- rigid-body flight model ---------- */
const P={m:1.5,S:0.28,b:1.4,c:0.2,Tmax:14,rho:1.225,Ix:0.05,Iy:0.12,Iz:0.10};
const st={p:new V3(),v:new V3(),q:new Q(),w:new V3(),V:0,al:0,ground:false,crash:0};
const c={ail:0,ele:0,rud:0,thr:0};let brake=0,simT=0;
function reset(){st.p.set(0,0.14,0);st.v.set(0,0,0);st.q.set(0,0,0,1);st.w.set(0,0,0);st.crash=0;st.V=0;st.al=0;c.ail=c.ele=c.rud=c.thr=0;thrT=0;L.y=-1;paintStick(sl,L);document.getElementById('msg').style.display='none';resetCourse()}

function step(dt){
 const qi=st.q.clone().invert();
 const wind=new V3(2+Math.sin(simT*.3),0,1+.7*Math.sin(simT*.45));
 const va=st.v.clone().sub(wind).applyQuaternion(qi);          // air velocity, body axes
 const V=Math.max(va.length(),0.01);
 const al=Math.atan2(-va.y,va.x),be=Math.asin(clamp(va.z/V,-1,1));
 st.V=V;st.al=al;
 const thrust=P.Tmax*c.thr*Math.max(0,1-Math.max(va.x,0)/38);
 const Ve=Math.max(Math.sqrt(V*V+60*c.thr*c.thr),1);            // prop-wash over tail/ailerons
 const qb=.5*P.rho*V*V,qe=.5*P.rho*Ve*Ve;
 // lift with stall blend into flat-plate behaviour
 const sat=sm(Math.abs(al),0.262,0.38);
 const CL=(4.8*al+0.15)*(1-sat)+0.95*Math.sin(2*al)*sat;
 const CD=0.035+CL*CL/(Math.PI*0.8*5)+1.2*Math.pow(Math.sin(al),2)*sat+0.8*Math.pow(Math.sin(be),2);
 const vh=va.clone().divideScalar(V);
 const Fb=vh.clone().multiplyScalar(-qb*P.S*CD);
 const ld=new V3(0,0,1).cross(vh);if(ld.length()>1e-4)ld.normalize();
 Fb.addScaledVector(ld,qb*P.S*CL);
 Fb.z+=-qb*P.S*0.8*be;Fb.x+=thrust;
 const F=Fb.applyQuaternion(st.q);F.y-=9.81*P.m;
 // moments (x=roll, y=yaw[+left], z=pitch[+nose up])
 const k=P.b/(2*Ve),kc=P.c/(2*Ve),{x:p,y:r,z:qq}=st.w;
 const Mx=qe*P.S*P.b*(0.08*c.ail-0.45*p*k-0.1*r*k)-qb*P.S*P.b*0.05*be-0.1*c.thr;
 const Mz=qe*P.S*P.c*(0.28*c.ele-12*qq*kc)+qb*P.S*P.c*(0.038-0.8*clamp(al,-0.7,0.7));
 const My=qb*P.S*P.b*(-0.06*be)+qe*P.S*P.b*(-0.02*c.rud-0.15*r*k+0.01*c.ail);
 const Mb=new V3(Mx,My,Mz);
 // ground contact (wheels + airframe)
 const Mg=new V3();st.ground=false;
 for(const cp of CP){
  const rW=cp.r.clone().applyQuaternion(st.q),pw=st.p.clone().add(rW);
  if(pw.y>=0)continue;
  const ww=st.w.clone().applyQuaternion(st.q),vw=st.v.clone().add(ww.clone().cross(rW));
  const N=Math.max(0,cp.k*(-pw.y)-cp.d*vw.y);
  if(cp.wheel){st.ground=true;if(-vw.y>6&&!st.crash)st.crash=.001}
  else if(vw.length()>6&&!st.crash)st.crash=.001;
  const fwd=new V3(1,0,0).applyQuaternion(st.q);fwd.y=0;
  if(fwd.length()<.05)fwd.set(1,0,0);fwd.normalize();
  if(cp.steer)fwd.applyAxisAngle(new V3(0,1,0),-0.3*c.rud);
  const side=fwd.clone().cross(new V3(0,1,0));
  const vf=vw.dot(fwd),vs=vw.dot(side);
  const Fw=new V3(0,N,0);
  if(cp.wheel){Fw.addScaledVector(side,-N*1.0*clamp(vs/.3,-1,1));Fw.addScaledVector(fwd,-N*(0.025+0.5*brake)*clamp(vf/.3,-1,1))}
  else{Fw.addScaledVector(side,-N*.5*clamp(vs/.5,-1,1));Fw.addScaledVector(fwd,-N*.5*clamp(vf/.5,-1,1))}
  F.add(Fw);Mg.add(rW.clone().cross(Fw).applyQuaternion(qi));
 }
 Mb.add(Mg);
 st.v.addScaledVector(F,dt/P.m);st.p.addScaledVector(st.v,dt);
 // Euler's rigid body equations with gyroscopic term
 const w=st.w,Iw=new V3(P.Ix*w.x,P.Iy*w.y,P.Iz*w.z),gy=w.clone().cross(Iw);
 w.x+=(Mb.x-gy.x)/P.Ix*dt;w.y+=(Mb.y-gy.y)/P.Iy*dt;w.z+=(Mb.z-gy.z)/P.Iz*dt;
 const dq=st.q.clone().multiply(new Q(w.x,w.y,w.z,0)),h=.5*dt;
 st.q.set(st.q.x+dq.x*h,st.q.y+dq.y*h,st.q.z+dq.z*h,st.q.w+dq.w*h).normalize();
 simT+=dt;
}

/* ---------- input: keyboard + touch sticks ---------- */
const K={};let inv=1,camMode=0,thrT=0;const key={ail:0,ele:0,rud:0};
const names=['Follow','Exterior (pilot)','Cockpit'];
addEventListener('keydown',e=>{K[e.code]=1;
 if(e.code=='KeyC')camMode=(camMode+1)%3;if(e.code=='KeyR')reset();if(e.code=='KeyI')inv=-inv;
 if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
document.getElementById('bv').onclick=()=>camMode=(camMode+1)%3;
document.getElementById('br').onclick=reset;
function mkStick(el,keepY){const s={x:0,y:keepY?-1:0,id:null,el,keepY};
 const set=e=>{const r=el.getBoundingClientRect(),R=r.width/2;
  let dx=(e.clientX-r.left-R)/(R*.7),dy=-(e.clientY-r.top-R)/(R*.7);const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
  s.x=dx;s.y=dy;paintStick(el,s)};
 el.addEventListener('pointerdown',e=>{if(s.id!==null)return;s.id=e.pointerId;el.setPointerCapture(e.pointerId);set(e);e.preventDefault()});
 el.addEventListener('pointermove',e=>{if(e.pointerId===s.id)set(e)});
 const up=e=>{if(e.pointerId!==s.id)return;s.id=null;s.x=0;if(!keepY)s.y=0;paintStick(el,s)};
 el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
 paintStick(el,s);return s}
function paintStick(el,s){el=s.el||el;el.lastElementChild.style.transform=`translate(${s.x*63}px,${-s.y*63}px)`}
const sl=document.getElementById('sl'),sr=document.getElementById('sr');
const L=mkStick(sl,true),R=mkStick(sr,false);
const ex=v=>0.5*v+0.5*v*v*v,pick=(a,b)=>Math.abs(a)>Math.abs(b)?a:b;
const kb=(a,b)=>(K[a]?1:0)-(K[b]?1:0);
function inputs(dt){
 const ramp=(cur,t,r)=>cur+clamp(t-cur,-r*dt,r*dt);
 key.ail=ramp(key.ail,kb('ArrowRight','ArrowLeft'),4);
 key.ele=ramp(key.ele,kb('ArrowDown','ArrowUp')*inv,4);
 key.rud=ramp(key.rud,kb('KeyD','KeyA'),4);
 thrT=clamp(thrT+kb('KeyW','KeyS')*0.6*dt,0,1);
 if(L.id!==null)thrT=(L.y+1)/2;
 if(st.crash){c.thr=0;return}
 c.ail=ramp(c.ail,ex(pick(key.ail,R.x)),8);
 c.ele=ramp(c.ele,ex(pick(key.ele,-R.y*inv)),8);
 c.rud=ramp(c.rud,ex(pick(key.rud,L.x)),8);
 c.thr=ramp(c.thr,thrT,3);
 brake=(K.Space||(document.body.classList.contains('touch')&&thrT<.03&&st.ground))?1:0;
}

/* ---------- cameras ---------- */
const cp0=new V3(0,3,-8),pilot=new V3(6,1.7,12),Rq=new Q().setFromAxisAngle(new V3(0,1,0),-Math.PI/2);
function updateCam(dt){
 const fw=new V3(1,0,0).applyQuaternion(st.q);plane.visible=camMode!=2;
 if(camMode==0){
  const back=fw.clone();back.y*=.5;back.normalize();
  const tg=st.p.clone().addScaledVector(back,-3.4);tg.y+=0.9;tg.y=Math.max(tg.y,0.3);
  cp0.lerp(tg,1-Math.exp(-5*dt));cam.position.copy(cp0);cam.up.set(0,1,0);
  cam.lookAt(st.p.clone().addScaledVector(fw,1.5));cam.fov=65;
 }else if(camMode==1){
  cam.position.copy(pilot);cam.up.set(0,1,0);cam.lookAt(st.p);
  const d=pilot.distanceTo(st.p),f=clamp(2*Math.atan(4/d)*57.3,7,65);cam.fov+=(f-cam.fov)*(1-Math.exp(-6*dt));
 }else{
  cam.position.copy(st.p).add(new V3(0.2,0.07,0).applyQuaternion(st.q));
  cam.quaternion.copy(st.q).multiply(Rq);cam.fov=85;
 }
 cam.updateProjectionMatrix();
}

/* ---------- beginner course: 10 rings, then land ---------- */
const GR=9,GP=[[50,6,0],[130,14,0],[210,20,-20],[240,22,-90],[200,22,-150],[110,22,-165],[10,22,-155],[-60,20,-100],[-70,12,-35],[-40,6,0]].map(a=>new V3(...a));
const gates=GP.map((p,i)=>{
 const n=i==GP.length-1?new V3(1,0,0):(GP[i+1].clone().sub(GP[i-1]||new V3(0,0,0)));n.y*=.3;n.normalize();
 const m=new THREE.Mesh(new THREE.TorusGeometry(GR,.35,8,40),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.4}));
 m.position.copy(p);m.quaternion.setFromUnitVectors(new V3(0,0,1),n);scene.add(m);return{p,n,m}});
let gi=0,tCourse=0,started=false,done=false,landT=0,prevS=null,best=null;
try{best=parseFloat(localStorage.getItem('rcBest'))||null}catch(e){}
function paintGates(){gates.forEach((g,i)=>{const m=g.m.material;m.color.set(i<gi?0x33dd55:i==gi?0xff9900:0xffffff);m.opacity=i<gi?.2:i==gi?.95:.4})}
function resetCourse(){gi=0;tCourse=0;started=false;done=false;landT=0;prevS=null;paintGates()}
function updateCourse(dt){
 if(st.crash||done)return;
 if(c.thr>.05)started=true;if(started)tCourse+=dt;
 if(gi<gates.length){
  const g=gates[gi],d=st.p.clone().sub(g.p),s=d.dot(g.n);
  if(prevS!==null&&prevS<0&&s>=0&&d.addScaledVector(g.n,-s).length()<GR){gi++;prevS=null;paintGates()}else prevS=s;
 }else{
  const onRw=st.ground&&Math.abs(st.p.z)<4.5&&st.p.x>-10&&st.p.x<110;
  if(onRw&&Math.hypot(st.v.x,st.v.z)<1.5){landT+=dt;if(landT>1)finish()}else landT=0;
 }
}
function finish(){done=true;const nb=!best||tCourse<best;if(nb){best=tCourse;try{localStorage.setItem('rcBest',best)}catch(e){}}
 msg.style.display='block';msg.textContent=`Course complete! ${tCourse.toFixed(1)} s${nb?' – new best!':''}  (R to fly again)`}
function courseHud(){
 let t=`TIME   ${tCourse.toFixed(1)} s${best?'   BEST '+best.toFixed(1)+' s':''}\nRINGS  ${gi}/${gates.length}\n`;
 if(gi>=gates.length)return t+(done?'DONE':'LAND on the runway and stop');
 const rel=gates[gi].p.clone().sub(st.p).applyQuaternion(st.q.clone().invert());
 const h=rel.z>4?'→':rel.z<-4?'←':'',v=rel.y>3?'↑':rel.y<-3?'↓':'';
 return t+`NEXT   ${rel.length().toFixed(0)} m ${rel.x<0?'turn around':h+v}`}

/* ---------- main loop ---------- */
const hud=document.getElementById('hud'),msg=document.getElementById('msg');
let last=performance.now(),acc=0;const H=1/240;reset();
function frame(now){
 const dt=Math.min((now-last)/1000,0.05);last=now;
 inputs(dt);acc+=dt;while(acc>=H){step(H);acc-=H}updateCourse(dt);
 if(st.crash){st.crash+=dt;msg.style.display='block';msg.textContent='Crashed – resetting…';if(st.crash>2.5)reset()}
 plane.position.copy(st.p);plane.quaternion.copy(st.q);
 aL.rotation.z=c.ail*.5;aR.rotation.z=-c.ail*.5;el.rotation.z=-c.ele*.5;ru.rotation.y=c.rud*.5;prop.rotation.x+=c.thr*60*dt+.2;
 shadow.position.set(st.p.x,0.03,st.p.z);const s=1/(1+st.p.y*.08);shadow.scale.setScalar(s);shadow.material.opacity=.35*s;
 updateCam(dt);
 const stall=Math.abs(st.al)>0.262&&st.V>4&&!st.ground;
 hud.textContent=`SPEED  ${(st.V*3.6).toFixed(0)} km/h\nALT    ${Math.max(0,st.p.y-.12).toFixed(1)} m\nTHR    ${(c.thr*100).toFixed(0)}%\nAOA    ${(st.al*57.3).toFixed(0)}°${stall?'  STALL':''}\nVIEW   ${names[camMode]}\n${courseHud()}`;
 renderer.render(scene,cam);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
