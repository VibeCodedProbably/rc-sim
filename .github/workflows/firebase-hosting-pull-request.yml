# Builds a temporary preview URL for every pull request
name: Deploy preview to Firebase Hosting
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLIGHTSIM_7C1D4 }}
          projectId: flightsim-7c1d4
